<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>S’Prima Booking</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
<body>

<div class="container">

  <h1>S’Prima Hostel</h1>
  <p class="subtitle">
    เช็คห้องว่างและส่งคำขอจองห้องพัก
  </p>

  <label>วันที่เข้าพัก</label>
  <input type="date" id="checkinDate">

  <label>จำนวนห้อง</label>
  <select id="rooms">
    <option value="">กดเพื่อเลือกจำนวนห้อง</option>
    <option value="1 ห้อง">1 ห้อง</option>
    <option value="2 ห้อง">2 ห้อง</option>
    <option value="3 ห้อง">3 ห้อง</option>
    <option value="มากกว่า 3 ห้อง">มากกว่า 3 ห้อง</option>
  </select>

  <label>จำนวนคืน</label>
  <select id="nights">
    <option value="">กดเพื่อเลือกจำนวนคืน</option>
    <option value="1 คืน">1 คืน</option>
    <option value="2 คืน">2 คืน</option>
    <option value="3 คืน">3 คืน</option>
    <option value="มากกว่า 3 คืน">มากกว่า 3 คืน</option>
  </select>

  <label>ประเภทห้อง</label>
  <select id="roomType">
    <option value="">กดเพื่อเลือกประเภทห้อง</option>
    <option value="ห้องมาตรฐาน 450 บาท">ห้องมาตรฐาน 450 บาท</option>
    <option value="ห้อง Superior 550 บาท">ห้อง Superior 550 บาท</option>
    <option value="ห้องใดก็ได้">ห้องใดก็ได้</option>
  </select>

  <label>เบอร์โทรศัพท์</label>
  <input
    type="tel"
    id="phone"
    placeholder="เช่น 087xxxxxxx"
  >

  <button id="submitBtn" onclick="submitForm()">
    ส่งคำขอจอง
  </button>

  <div id="status"></div>

  <div class="note">
    หลังส่งคำขอ ทีมงานจะตรวจสอบห้องว่าง
    และติดต่อกลับเพื่อยืนยันอีกครั้งค่ะ
  </div>

  <div class="divider">
    หมายเหตุ
  </div>

  <div class="security-box">
    <div class="security-icon">✅</div>

    <div>
      ข้อมูลของคุณจะถูกเก็บเป็นความลับ
      และใช้เพื่อการติดต่อยืนยันการจองเท่านั้น
    </div>
  </div>

</div>

<script>
const LIFF_ID = "2010199464-Ylx6zXrL";

const API_URL =
"https://script.google.com/macros/s/AKfycbwRBXDsNOME9GcqJ1gt4gPLx9z4pAxtWa0JgPXO-NnFZK_3F10AfV16S3Q8mJ9o1wjF/exec";

let userId = "";

async function main() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();

    userId = profile.userId || "";

  } catch(err) {

    document.getElementById("status").innerText =
      "ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาปิดแล้วเปิดใหม่อีกครั้งค่ะ";

  }

}

async function submitForm() {

  const status =
    document.getElementById("status");

  const submitBtn =
    document.getElementById("submitBtn");

  const data = {

    userId: userId,

    checkinDate:
      document.getElementById("checkinDate").value,

    rooms:
      document.getElementById("rooms").value,

    nights:
      document.getElementById("nights").value,

    roomType:
      document.getElementById("roomType").value,

    phone:
      document.getElementById("phone").value

  };

  if (
    !data.checkinDate ||
    !data.rooms ||
    !data.nights ||
    !data.roomType ||
    !data.phone
  ) {

    status.innerText =
      "กรุณากรอกข้อมูลให้ครบก่อนส่งค่ะ";

    return;
  }

  submitBtn.disabled = true;

  status.innerText =
    "กำลังส่งข้อมูล กรุณารอสักครู่...";

  try {

    await fetch(API_URL, {

      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(data)

    });

    status.innerText =
      "ได้รับคำขอจองแล้วค่ะ 😊\nทีมงานจะตรวจสอบห้องว่างและติดต่อกลับโดยเร็วที่สุดค่ะ";

  } catch(err) {

    status.innerText =
      "ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้งค่ะ";

    submitBtn.disabled = false;

  }

}

main();
</script>

</body>
</html>
