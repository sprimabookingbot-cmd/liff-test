<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>S’Prima Booking</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #ffffff;
  color: #111;
  overflow-x: hidden;
}

.container {
  width: 100vw;
  max-width: 100vw;
  padding: 18px;
  box-sizing: border-box;
}

.card {
  width: 100%;
  padding: 0;
  box-sizing: border-box;
  background: #ffffff;
}

h2 {
  margin: 0 0 14px;
  font-size: 56px;
  font-weight: 800;
  line-height: 1.1;
  color: #06c755;
}

.subtitle {
  font-size: 34px;
  line-height: 1.6;
  color: #555;
  margin: 0 0 42px;
}

label {
  display: block;
  font-size: 38px;
  font-weight: 800;
  margin: 38px 0 18px;
  color: #111;
}

input,
select {
  width: 100%;
  height: 110px;
  box-sizing: border-box;
  padding: 0 28px;
  border: 2px solid #dddddd;
  border-radius: 26px;
  background: #ffffff;
  font-size: 40px;
  color: #111;
}

button {
  width: 100%;
  height: 112px;
  margin-top: 46px;
  border: none;
  border-radius: 28px;
  background: #06c755;
  color: white;
  font-size: 40px;
  font-weight: 800;
}

.note {
  margin-top: 32px;
  font-size: 42px;
  line-height: 1.7;
  color: #666;
  font-weight: 600;
}

#status {
  margin-top: 34px;
  font-size: 46px;
  line-height: 1.7;
  color: #111;
  font-weight: 700;
}
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <h2>S’Prima Hostel</h2>
    <p class="subtitle">เช็คห้องว่างและส่งคำขอจองห้องพัก</p>

    <label>วันที่เข้าพัก</label>
    <input type="date" id="checkinDate" required>

    <label>จำนวนห้อง</label>
    <select id="rooms">
      <option value="">กดเพื่อเลือกจำนวนห้อง</option>
      <option value="1 ห้อง">1 ห้อง</option>
      <option value="2 ห้อง">2 ห้อง</option>
      <option value="3 ห้อง">3 ห้อง</option>
    </select>

    <label>จำนวนคืน</label>
    <select id="nights">
      <option value="">กดเพื่อเลือกจำนวนคืน</option>
      <option value="1 คืน">1 คืน</option>
      <option value="2 คืน">2 คืน</option>
      <option value="3 คืน">3 คืน</option>
    </select>

    <label>ประเภทห้อง</label>
    <select id="roomType">
      <option value="">กดเพื่อเลือกประเภทห้อง</option>
      <option value="ห้องมาตรฐาน 450 บาท">ห้องมาตรฐาน 450 บาท</option>
      <option value="ห้อง Superior 550 บาท">ห้อง Superior 550 บาท</option>
      <option value="ห้องใดก็ได้">ห้องใดก็ได้</option>
    </select>

    <label>เบอร์โทรศัพท์</label>
    <input type="tel" id="phone" placeholder="เช่น 087xxxxxxx">

    <button id="submitBtn" onclick="submitForm()">ส่งคำขอจอง</button>

    <p class="note" id="note">หลังส่งคำขอ ทีมงานจะตรวจสอบห้องว่างและติดต่อกลับเพื่อยืนยันอีกครั้งค่ะ</p>
    <p id="status"></p>
  </div>
</div>

<script>
const LIFF_ID = "2010199464-Ylx6zXrL";
const API_URL = "https://script.google.com/macros/s/AKfycbwRBXDsNOME9GcqJ1gt4gPLx9z4pAxtWa0JgPXO-NnFZK_3F10AfV16S3Q8mJ9o1wjF/exec";

let userId = "";

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    userId = profile.userId || "";

  } catch (err) {
    document.getElementById("status").innerText =
      "ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาปิดแล้วเปิดใหม่อีกครั้งค่ะ";
  }
}

async function submitForm() {
  const status = document.getElementById("status");

  const data = {
    userId: userId || "",
    checkinDate: document.getElementById("checkinDate").value,
    rooms: document.getElementById("rooms").value,
    nights: document.getElementById("nights").value,
    roomType: document.getElementById("roomType").value,
    phone: document.getElementById("phone").value
  };

  if (!data.checkinDate || !data.rooms || !data.nights || !data.roomType || !data.phone) {
    status.innerText = "กรุณากรอกข้อมูลให้ครบก่อนส่งค่ะ";
    return;
  }

  status.innerText = "กำลังส่งข้อมูล กรุณารอสักครู่...";
  document.getElementById("submitBtn").disabled = true;

  try {
    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    document.getElementById("note").style.display = "none";
    status.innerText = "ได้รับข้อมูลแล้วค่ะ ทีมงานจะตรวจสอบห้องว่างและติดต่อกลับโดยเร็วที่สุดค่ะ 😊";

  } catch (err) {
    status.innerText = "ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้งค่ะ";
    document.getElementById("submitBtn").disabled = false;
  }
}

main();
</script>
</body>
</html>
