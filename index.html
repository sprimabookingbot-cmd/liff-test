<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>S’Prima Booking</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  color: #222;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 24px;
}

.card {
  background: #fff;
  border-radius: 22px;
  padding: 26px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

h1 {
  margin: 0;
  font-size: 34px;
  line-height: 1.15;
  font-weight: 800;
}

.subtitle {
  margin-top: 8px;
  color: #666;
  line-height: 1.5;
  font-size: 18px;
}

.section-title {
  margin-top: 30px;
  margin-bottom: 10px;
  font-size: 20px;
  font-weight: 800;
}

input,
select {
  width: 100%;
  box-sizing: border-box;
  border: 1.5px solid #ddd;
  border-radius: 18px;
  padding: 18px;
  font-size: 20px;
  background: #fff;
  margin-bottom: 18px;
}

button {
  width: 100%;
  border: none;
  border-radius: 20px;
  background: #06C755;
  color: #fff;
  font-size: 24px;
  padding: 20px;
  font-weight: 800;
  margin-top: 14px;
}

button:disabled {
  opacity: 0.55;
}

#status {
  margin-top: 22px;
  padding: 18px;
  border-radius: 18px;
  background: #effcf3;
  border: 1px solid #c9edd5;
  white-space: pre-line;
  font-size: 20px;
  line-height: 1.6;
  font-weight: 700;
  display: none;
}

.note {
  margin-top: 24px;
  font-size: 16px;
  color: #777;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>S’Prima Hostel</h1>

    <div class="subtitle">
      เช็คห้องว่างและส่งคำขอจองห้องพัก
    </div>

    <div class="section-title">วันที่เข้าพัก</div>
    <input type="date" id="checkinDate">

    <div class="section-title">วันที่เช็คเอาท์</div>
    <input type="date" id="checkoutDate">

    <div class="section-title">จำนวนผู้เข้าพัก</div>
    <select id="guests">
      <option value="">เลือกจำนวนผู้เข้าพัก</option>
      <option value="1">1 ท่าน</option>
      <option value="2">2 ท่าน</option>
      <option value="3">3 ท่าน</option>
      <option value="4">4 ท่าน</option>
      <option value="5">5 ท่าน</option>
      <option value="6">6 ท่าน</option>
      <option value="7">7 ท่าน</option>
      <option value="8">8 ท่าน</option>
      <option value="มากกว่า 8">มากกว่า 8 ท่าน</option>
    </select>

    <div class="section-title">เบอร์โทรศัพท์</div>
    <input type="tel" id="phone" placeholder="เช่น 087xxxxxxx">

    <button id="submitBtn" onclick="submitForm()">
      เช็คห้องว่าง
    </button>

    <div id="status"></div>

    <div class="note">
      ระบบจะตรวจสอบห้องว่างเบื้องต้น และทีมงานจะติดต่อกลับเพื่อยืนยันอีกครั้งค่ะ
    </div>

  </div>
</div>

<script>
const LIFF_ID = "2010199464-Ylx6zXrL";

const API_URL =
"https://script.google.com/macros/s/AKfycbwRBXDsNOME9GcqJ1gt4gPLx9z4pAxtWa0JgPXO-NnFZK_3F10AfV16S3Q8mJ9o1wjF/exec";

let userId = "";

function toDateInputValue(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function parseDateInput(value) {
  const parts = value.split("-");
  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );
}

function addDays(dateString, days) {
  const d = parseDateInput(dateString);
  d.setDate(d.getDate() + days);
  return toDateInputValue(d);
}

function showStatus(message) {
  const status = document.getElementById("status");
  status.style.display = "block";
  status.innerText = message;
}

function setupDates() {
  const checkin = document.getElementById("checkinDate");
  const checkout = document.getElementById("checkoutDate");

  const today = toDateInputValue(new Date());

  checkin.min = today;
  checkin.value = today;

  const tomorrow = addDays(today, 1);
  checkout.min = tomorrow;
  checkout.value = tomorrow;

  checkin.addEventListener("change", function () {
    if (!checkin.value) return;

    const minCheckout = addDays(checkin.value, 1);
    checkout.min = minCheckout;

    if (!checkout.value || checkout.value <= checkin.value) {
      checkout.value = minCheckout;
    }
  });
}

async function main() {
  setupDates();

  try {
    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    userId = profile.userId || "";

  } catch (err) {
    showStatus("ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาปิดแล้วเปิดใหม่อีกครั้งค่ะ");
  }
}

async function submitForm() {
  const submitBtn = document.getElementById("submitBtn");

  const checkinDate = document.getElementById("checkinDate").value;
  const checkoutDate = document.getElementById("checkoutDate").value;
  const guests = document.getElementById("guests").value;
  const phone = document.getElementById("phone").value;

  if (!checkinDate || !checkoutDate || !guests || !phone) {
    showStatus("กรุณากรอกข้อมูลให้ครบค่ะ");
    return;
  }

  if (checkoutDate <= checkinDate) {
    showStatus("กรุณาเลือกวันที่เช็คเอาท์หลังวันที่เข้าพักค่ะ");
    return;
  }

const nights = Math.ceil(
  (parseDateInput(checkoutDate) - parseDateInput(checkinDate)) /
  (1000 * 60 * 60 * 24)
);

  const data = {
    userId: userId,
    checkinDate: checkinDate,
    checkoutDate: checkoutDate,
    nights: nights,
    guests: guests,
    phone: phone
  };

  submitBtn.disabled = true;
  showStatus("กำลังตรวจสอบห้องว่าง...");

  try {
    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    showStatus("ส่งคำขอเรียบร้อยแล้วค่ะ 😊\nทีมงานจะตรวจสอบและติดต่อกลับโดยเร็วที่สุดค่ะ");

  } catch (err) {
    showStatus("ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้งค่ะ");
    submitBtn.disabled = false;
  }
}

main();
</script>

</body>
</html>
